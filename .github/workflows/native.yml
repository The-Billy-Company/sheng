name: Native

# One matrix, called from both `ci.yml` (cached, every push and PR) and
# `release.yml` (uncached, gating publish). Kept as its own reusable workflow
# rather than duplicated so the six-target list is a fact stated once — the
# lesson `Cargo.toml`'s own header already states about this crate's build
# shape, applied to CI.
on:
  workflow_call:
    inputs:
      cache:
        description: >-
          Restore the Rust build cache. On for CI, where a faster loop is
          worth it. Off for release: a restored cache is writable by any
          branch that can run a workflow, so a release build that read one
          would be verifying bytes an attacker could have contributed.
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Every leg is real, native silicon for its (OS, architecture) pair — never an
  # emulated or cross-compiled target — because `src/arch/`'s vector kernels have
  # never actually executed their intrinsics on a target that only ever ran them
  # under emulation, and `price::MINTED`'s calibration is a claim about a real
  # machine's memory and shuffle-port behavior that emulation cannot stand in for.
  #
  # Windows joins the two operating systems this crate already covered as a
  # *third OS on the same two architectures*, not a third architecture: nothing
  # in `src/arch/` gates on `target_os`, only on `target_arch` plus a runtime
  # feature probe. So the six legs below are one dispatch ladder proved six
  # times, not six ladders — and every assertion in `tests/soundness.rs` that
  # dispatch actually chose a vector kernel (never comparing the scalar path to
  # itself) runs on all six rather than trusting that Windows follows the same
  # `cfg` the other two OSes already exercise.
  proof:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x86_64 (ssse3)
          - os: ubuntu-24.04-arm
            label: linux-aarch64 (neon)
          - os: macos-15-intel
            label: macos-x86_64 (ssse3)
          - os: macos-15
            label: macos-aarch64 (neon)
          - os: windows-2025
            label: windows-x86_64 (ssse3)
          - os: windows-11-arm
            label: windows-aarch64 (neon)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes with the checkout credential, and leaving it in
          # .git/config is how it ends up inside an uploaded artifact.
          persist-credentials: false

      # `survey`'s worth-test is a claim about nanoseconds per byte read from
      # memory, and a corpus under its own 8 MiB floor is cache-resident on
      # every one of these runners — the model does not apply there, so a
      # missing corpus would make this job pass by declining to judge rather
      # than by proving anything. Four small public repos stand in for a real
      # tree: sheng's own upstream engine and its two search-engine cousins,
      # pinned by commit so every leg on every run reads the same bytes rather
      # than whatever each repo's `main` happened to hold that day. Combined
      # they are ~14 MiB of real source after `examples/common.rs`'s own
      # extension and directory filters — comfortably past the floor without
      # cloning anything sheng does not already cite in its own README.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/irregex
          ref: f24276fb72baf13f50e867d26d052bdcfa8579e3
          persist-credentials: false
          path: corpus/irregex
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/gist
          ref: 3a56b5d62c561175f93693b0de4a471b358f1dc8
          persist-credentials: false
          path: corpus/gist
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/relate
          ref: 4c61e3c8c902beeb2db027e1ef51787ac7e49c5c
          persist-credentials: false
          path: corpus/relate
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: The-Billy-Company/blast
          ref: ab6951c4e733701b00821037f4336183dccf2cf3
          persist-credentials: false
          path: corpus/blast

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - if: inputs.cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Release, not dev: the SIMD kernels are the whole point of the crate and
      # the soundness/kernel-agreement suites are the tests that matter here, so
      # they run under the profile a real caller links against. This is also
      # where `tests/soundness.rs::every_accelerated_kernel_agrees_with_the_scalar_reference`
      # asserts dispatch chose a real vector kernel on this (OS, arch) pair
      # rather than silently falling back to `Scalar`.
      - run: cargo test --workspace --release --all-features --locked

      # `SHENG_SURVEY_REQUIRE_CORPUS` turns `examples/survey.rs`'s "no verdict,
      # corpus too small" print into a hard failure. A human re-minting locally
      # against their own half-built checkout should get a friendly refusal to
      # judge; a CI leg whose corpus checkout silently shrank should not get to
      # call that a pass.
      - env:
          SHENG_CORPUS: ${{ github.workspace }}/corpus
          SHENG_SURVEY_REQUIRE_CORPUS: "1"
        run: cargo run --release --example survey
