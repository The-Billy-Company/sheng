name: Release

# Guarded: every step through `cargo publish --dry-run` always runs, so a tag with
# a version mismatch or a broken package fails loudly. The one irreversible step —
# `cargo publish` itself — additionally requires the `CARGO_REGISTRY_TOKEN`
# repository secret to be configured, so pushing this workflow file grants no
# publish capability by itself. A maintainer prepares a release by running
# `towncrier build --version X.Y.Z`, committing the folded `CHANGELOG.md`, bumping
# `Cargo.toml`, and tagging — this workflow verifies that was done, it does not do
# it for you.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# Serialized per tag, and never cancelled: the other workflows cancel a superseded run
# because a newer commit makes the older answer irrelevant, but a half-finished publish
# is not an irrelevant answer.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes with the checkout credential, and leaving it in
          # .git/config is how it ends up inside an uploaded artifact.
          persist-credentials: false
      - id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $cargo_version"
            exit 1
          fi
          if ! grep -qF "## [$tag]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$tag]' entry — run 'towncrier build --version $tag' and commit it before tagging"
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      # Deliberately uncached, unlike ci.yml. A restored cache is writable by any
      # branch that can run a workflow, so a release build that reads one is
      # verifying bytes an attacker could have contributed. This job runs once per
      # version and a cold compile costs a couple of minutes.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-deny
      - run: cargo deny check
      - run: cargo package --locked
      - run: cargo publish --dry-run --locked

  # The six-target native correctness + economic proof, called uncached for the
  # same reason `verify` above is: this run gates the one irreversible step in the
  # whole workflow, so it verifies bytes this run compiled itself rather than
  # anything a cache handed it. `verify`'s own `cargo test` ran on `ubuntu-latest`
  # alone before this job existed — that single leg is now subsumed by all six here,
  # not skipped.
  native:
    name: native
    uses: ./.github/workflows/native.yml
    with:
      cache: false

  publish:
    name: publish
    needs: [verify, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes with the checkout credential, and leaving it in
          # .git/config is how it ends up inside an uploaded artifact.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      # Uncached for the same reason as `verify`, and more so: this is the job whose
      # output reaches crates.io.
      #
      # The one irreversible step in this whole workflow, so it carries its own gate
      # rather than trusting the job to have been skipped correctly: no repository
      # secret, no publish, regardless of what triggered this run.
      #
      # The gate reads `env`, not `secrets`, because Actions rejects the `secrets`
      # context inside any `if:` at parse time — a workflow spelling it that way does
      # not fail closed, it fails to load, and every job in it silently never runs.
      # Aliasing the secret into step `env` is the documented way to condition on one.
      - name: cargo publish
        if: env.CARGO_REGISTRY_TOKEN != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  github-release:
    name: github release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      # Creating the GitHub release for this tag writes a release object, which the API
      # counts as repository contents. Nothing else in this job needs a token.
      contents: write # to create the release for this tag
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes with the checkout credential, and leaving it in
          # .git/config is how it ends up inside an uploaded artifact.
          persist-credentials: false
      # `$VERSION` rather than an inline `${{ }}`: interpolating into a shell script
      # splices the value in as code, so the tag pattern is the only thing standing
      # between the trigger and an injection. An env var is passed as data.
      - id: notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="## [$VERSION]" '
            $0 == v { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: /tmp/release-notes.md
          generate_release_notes: false
