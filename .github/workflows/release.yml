name: Release

# Guarded: every step through `cargo publish --dry-run` always runs, so a tag with
# a version mismatch or a broken package fails loudly. `preflight` re-proves, on
# the immutable tagged commit, everything a maintainer is supposed to have done
# by hand before tagging: the tag names the version `Cargo.toml` declares, every
# marked mirror agrees, changelog.d/ was folded (not left with pending
# fragments), the tag is reachable from `main`, and `release-ready` was green on
# this exact SHA. The one irreversible step — `cargo publish` itself — uses
# crates.io Trusted Publishing (OIDC), so pushing this workflow file grants no
# publish capability by itself; a maintainer prepares a release by merging the
# release-please PR, which already folded the changelog and bumped the version,
# and release-please itself cuts the GitHub Release the moment that PR merges —
# this workflow only ever publishes the crate.
#
# ONE-TIME SETUP: crates.io Trusted Publishing, so there is no
# `CARGO_REGISTRY_TOKEN` to rotate or leak. On crates.io, add a trusted
# publisher to the `sheng` crate pointing at this repository, workflow
# `release.yml`, environment `crates-io`. crates.io requires the crate to
# exist first, so this crate's first release must already be published.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

# Serialized per tag, and never cancelled: the other workflows cancel a superseded run
# because a newer commit makes the older answer irrelevant, but a half-finished publish
# is not an irrelevant answer.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    # The shared release contract (`release.toml` + the org's `package-release`
    # action), run once before anything is built: is the tag the version
    # `Cargo.toml` and every mirror declare, is the changelog folded with the
    # exact `## [X.Y.Z]` heading and no fragment left un-folded, did
    # `release-ready` go green on this exact commit, and is this commit
    # actually reachable from `main`? Every step below is conditioned on an
    # actual tag, so a `workflow_dispatch` dry run (no tag) passes through as
    # a no-op and `verify`/`native` still run unpublished.
    name: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: The-Billy-Company/.github/actions/package-release@18530e6f8b7ad634dcfe52e423e2a0a8e7bd521e # main
        with:
          command: version
          args: --root . --tag ${{ github.ref_name }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: The-Billy-Company/.github/actions/package-release@18530e6f8b7ad634dcfe52e423e2a0a8e7bd521e # main
        with:
          command: changelog
          args: >-
            --root . --require-fragments-empty
            --version ${{ fromJSON(steps.version.outputs.result).version }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: The-Billy-Company/.github/actions/package-release@18530e6f8b7ad634dcfe52e423e2a0a8e7bd521e # main
        with:
          command: tag-ancestor
          args: ${{ github.repository }} ${{ github.sha }} --branch main
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: The-Billy-Company/.github/actions/package-release@18530e6f8b7ad634dcfe52e423e2a0a8e7bd521e # main
        with:
          command: ci-status
          args: ${{ github.repository }} ${{ github.sha }}

  verify:
    name: verify
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, and leaving it in
          # .git/config is how it ends up inside an uploaded artifact.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      # Deliberately uncached, unlike ci.yml. A restored cache is writable by any
      # branch that can run a workflow, so a release build that reads one is
      # verifying bytes an attacker could have contributed. This job runs once per
      # version and a cold compile costs a couple of minutes.
      - run: cargo fmt --all --check
      # The release bumps `Cargo.toml` through its `x-release-please-version`
      # annotation, and a lockfile records the version of the package it locks -
      # including this one. So a version bump leaves the committed lock naming the
      # previous version, and `--locked` is specifically the flag that refuses to
      # fix it: gist's v1.2.0 died on this with "cannot update the lock file
      # because --locked was passed". Every step below is `--locked`, so the
      # re-pin comes first. `--workspace` moves only the local packages, against
      # the manifests beside them, and leaves every third-party pin exactly as
      # committed - which is the whole point of `--locked` on the steps below.
      - run: cargo update --workspace
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-deny
      - run: cargo deny check
      - run: cargo package --locked
      - run: cargo publish --dry-run --locked

  # The six-target native correctness + economic proof, called uncached for the
  # same reason `verify` above is: this run gates the one irreversible step in the
  # whole workflow, so it verifies bytes this run compiled itself rather than
  # anything a cache handed it. `verify`'s own `cargo test` ran on `ubuntu-latest`
  # alone before this job existed — that single leg is now subsumed by all six here,
  # not skipped.
  native:
    name: native
    needs: preflight
    uses: ./.github/workflows/native.yml
    with:
      cache: false

  publish:
    name: publish
    needs: [preflight, verify, native]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      # The OIDC token Trusted Publishing exchanges for a short-lived registry token.
      id-token: write # crates.io exchanges this OIDC identity for the publish token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, and leaving it in
          # .git/config is how it ends up inside an uploaded artifact.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # Asked before a credential is minted, not after a failed upload. A retry
      # after a flake, or a dispatch on an existing tag, must not fail because the
      # version is already on the index — a published version is immutable there,
      # so "already present" is success. An "error" probe (registry unreachable)
      # is a hard fail: it must never be read as "absent" and re-published blind.
      - id: probe
        uses: The-Billy-Company/.github/actions/package-release@18530e6f8b7ad634dcfe52e423e2a0a8e7bd521e # main
        with:
          command: registry-probe
          args: crates sheng ${{ steps.tag.outputs.version }}
      - name: probe answered
        env:
          STATE: ${{ steps.probe.outputs.result }}
        run: |
          set -euo pipefail
          if [ "$STATE" = error ]; then
            echo "::error::crates.io did not answer for sheng ${{ steps.tag.outputs.version }} —" \
                 "a network failure is never treated as \"absent\"." >&2
            exit 1
          fi
          echo "sheng ${{ steps.tag.outputs.version }} on crates.io: $STATE"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        if: steps.probe.outputs.result == 'absent'
      # Same reason as in `verify`: the bump moved `Cargo.toml` and not the lock,
      # and `--locked` below is the flag that refuses to reconcile them.
      - name: Re-pin the workspace members the version bump moved
        if: steps.probe.outputs.result == 'absent'
        run: cargo update --workspace
      - name: cargo publish
        if: steps.probe.outputs.result == 'absent'
        # Uncached for the same reason as `verify`, and more so: this is the job whose
        # output reaches crates.io. No repository secret, no long-lived token — the
        # `crates-io` environment's OIDC identity is what authorizes this publish.
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  # Give the GitHub Release the notes this repository actually wrote.
  #
  # release-please composes the release body itself, off conventional-commit
  # subjects filtered through `changelog-sections` — a separate path from the
  # `skip-changelog` that hands CHANGELOG.md to towncrier. So the page people
  # land on is assembled from commit subjects while the notes someone wrote sit
  # in the changelog, and nothing joined them: irregex v2.1.1 published two
  # lines against a folded section of a hundred and ten, because eleven of its
  # thirteen commits were `ci:` or `docs:` and both are `hidden`. This posts the
  # folded `## [X.Y.Z]` section over that body.
  #
  # Deliberately not `needs: preflight`: preflight's last step waits up to an
  # hour for `release-ready` on this commit, and the release page should read
  # correctly within a minute of the tag rather than after the publish gate
  # clears. Nothing here ships an artifact, so it does not need that gate — and
  # if the section is missing this fails loudly, leaving the release with the
  # thin body it was born with rather than a wrong one.
  notes:
    name: release notes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # `gh release edit`, on a release this repository owns
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: The-Billy-Company/.github/actions/package-release@18530e6f8b7ad634dcfe52e423e2a0a8e7bd521e # main
        with:
          command: notes
          args: >-
            --root . --version ${{ github.ref_name }}
            --out /tmp/release-notes.md --repo ${{ github.repository }}

      # The release usually exists before this workflow starts — release-please
      # creates it through the API, and creating it is what puts the tag on the
      # remote that triggered this run. Usually is not always: a tag pushed any
      # other way arrives with no release behind it, and editing one that does
      # not exist fails on a tag that is already immutable. So wait for it,
      # bounded, rather than assuming the ordering holds.
      - name: Post the folded section over the generated body
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" --json id >/dev/null 2>&1; then
              gh release edit "$TAG" --notes-file /tmp/release-notes.md
              echo "posted $(wc -c < /tmp/release-notes.md) bytes to the $TAG release"
              exit 0
            fi
            echo "no release on $TAG yet (attempt $attempt/30) — waiting"
            sleep 10
          done
          echo "::error::no GitHub Release on $TAG after five minutes — its body" \
               "was left as generated. Post it by hand with \`gh release edit\`" \
               "and the section from CHANGELOG.md." >&2
          exit 1
