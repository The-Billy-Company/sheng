name: zizmor

on:
  push:
    branches: [main]
    paths: [.github/workflows/**]
  pull_request:
    paths: [.github/workflows/**]

permissions:
  contents: read

jobs:
  # Audits this repository's own workflows for the injection, impostor-commit, and
  # excess-permission patterns that a hash-pinned action list does not by itself
  # rule out — the contract these workflows claim to hold is worth checking rather
  # than assuming.
  audit:
    name: audit workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: zizmor
      - run: zizmor --persona=pedantic .github/workflows/
