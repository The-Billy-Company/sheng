name: Miri

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: miri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scoped to the crate's portable logic — the priors, the cost model, and the
  # register-composition constants that run without ever touching an unsafe kernel
  # or building a `regex-automata` DFA. Two things are excluded on purpose, for two
  # different reasons:
  #
  # * The hand-written intrinsics in `src/arch/`, reached from four
  #   `skip::tests` and from every integration test in `tests/`. These are checked
  #   instead by real silicon in `ci.yml`'s cross-architecture matrix, running the
  #   actual instructions rather than an interpreter's approximation of them.
  # * Every DFA-building test: `tests/policy.rs`, `tests/soundness.rs`, and all of
  #   `selectivity::tests`, each of whose three cases goes through the module's own
  #   `quotients` helper. `regex-automata` determinization is measurably expensive
  #   even natively (see `src/selectivity.rs`'s own "~50 ms per Sieve::new" note) and
  #   Miri's interpretation overhead turns that into whole minutes per call — a real
  #   cost with no UB left to find along that path, since determinization touches no
  #   `unsafe` this crate owns. The skip is written as the module rather than as three
  #   names because naming them individually is what let two of the three back in: the
  #   list said `grouping_*` while the comment above it said every DFA-building test,
  #   and the run went from 87 seconds to hours without ever failing.
  miri:
    name: miri (portable paths)
    runs-on: ubuntu-latest
    # Well over the ~90 seconds the portable set takes, and far under the 6 hours a
    # job runs for by default. A Miri leg that grows a DFA build should be caught by
    # something louder than a queue slot occupied all afternoon.
    timeout-minutes: 20
    # `rust-toolchain.toml` pins 1.96.0 and rustup honors the file over whatever the
    # setup action made default, so without this `cargo miri` resolves to a stable
    # toolchain that has no miri component at all. The env override outranks the file.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, and leaving it in
          # .git/config is how it ends up inside an uploaded artifact.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: miri
      - run: cargo miri setup
      - env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: |
          cargo miri test --locked --lib -- \
            --skip skip::tests::every_instrument_agrees_with_the_definition \
            --skip skip::tests::the_classifier_admits_exactly_the_set \
            --skip skip::tests::the_classifier_is_exact_on_sets_nobody_hand_picked \
            --skip skip::tests::an_escape_is_found_at_every_offset_of_every_length \
            --skip selectivity::tests::
