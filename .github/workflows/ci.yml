name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A force-push mid-run should cancel the run it obsoleted, not race it - but only
# on a branch whose runs are drafts. On `main` every commit is a candidate to be
# released, and `release.yml` refuses to publish a tag unless `release-ready`
# concluded success on that exact commit. Cancelling here made the next push to
# main revoke the previous commit's verdict: one job ends `cancelled`,
# `release-ready` runs `if: always()` and reads that as a failure, and preflight
# declines a release that nothing was actually wrong with. So main's runs never
# cancel each other and each commit keeps its own answer.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, and leaving it in
          # .git/config is how it ends up inside an uploaded artifact.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  # Clippy and the release-mode test suite both run on real x86_64 and real macOS
  # arm64 hardware — this matrix *is* the cross-architecture SIMD differential the
  # crate's soundness rests on, not a stand-in for it. Vector kernels that only ever
  # run on emulated or cross-compiled targets have never actually executed the
  # intrinsics this crate ships.
  #
  # The legs are named for the machine and not for the kernel, because the kernel is
  # not a property of the leg. `arch::available` probes `CPUID` at runtime, so what an
  # `x86_64` runner offers is whatever the fleet handed us that morning — a label
  # reading `x86_64-ssse3` was a guess about someone else's hardware written into a job
  # name, and it went stale the moment a second x86 rung existed. The `test` leg prints
  # the ladder it actually got.
  clippy:
    name: clippy (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: x86_64
          - os: macos-14
            label: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, and leaving it in
          # .git/config is how it ends up inside an uploaded artifact.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.label }}, release)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: x86_64
          - os: macos-14
            label: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, and leaving it in
          # .git/config is how it ends up inside an uploaded artifact.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Release, not dev: the SIMD kernels are the whole point of the crate and the
      # soundness/kernel-agreement suites are the tests that matter here, so they run
      # under the profile a real caller links against.
      #
      # This overlaps `native`'s six legs on two of its (OS, architecture) pairs, and the
      # overlap is the point rather than an oversight: no corpus is checked out here, so
      # `$SHENG_CORPUS` is unset and `common::root` falls back to this crate's own tree.
      # That is what a downstream `cargo test` in a plain `cargo package` checkout sees,
      # and the floors in `tests/soundness.rs` are sized for exactly that — a suite that
      # only ever passed beside ~14 MiB of borrowed source would be green here and red for
      # a packager.
      - run: cargo test --workspace --release --all-features --locked
      # The dispatch ladder, printed rather than inferred. `available()` is the one thing
      # in this crate decided by the *machine* rather than by the target, so a leg that
      # quietly found fewer kernels than the last run is invisible inside a green suite —
      # the sweep simply covers less and still passes. It is also the only place CI says
      # out loud whether this runner has the silicon to differentiate the rungs
      # `price::DORMANT` still names: an AVX-512 box prints four kernels here and an EPYC
      # prints three, and which one the fleet handed us is not otherwise recorded
      # anywhere.
      - run: cargo test --release --all-features --locked --test kernels -- --nocapture
      - run: cargo run --release --example survey

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, and leaving it in
          # .git/config is how it ends up inside an uploaded artifact.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked
      # Also without them, because half the intra-doc links in the crate docs point at
      # items the `regex-automata` feature brings in — a rustdoc run that only ever sees
      # every feature at once cannot notice a link that dangles for the callers who
      # turned one off.
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --no-default-features --locked

  # The floor `rust-version` in Cargo.toml is a promise, not an aspiration — this is
  # what checks it every push instead of on the day a caller's pinned toolchain
  # discovers it first.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, and leaving it in
          # .git/config is how it ends up inside an uploaded artifact.
          persist-credentials: false
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --all-targets --all-features --locked

  # The `no_std` promise, checked rather than claimed. Two things can quietly break
  # it and neither shows up in any job above, because every one of those builds with
  # `--all-features`: a `std::` path creeping back into the library, and a feature
  # combination nobody compiles.
  #
  # So this enumerates the **complete powerset** of the two features — four builds —
  # rather than sampling it, which is affordable precisely because the feature set is
  # deliberately two wide. Then it builds for two bare-metal targets, where the check
  # has teeth that a host `--no-default-features` build does not: `std` is not merely
  # unused there, it does not exist, and `x86_64-unknown-none` additionally has no SSE
  # at all, so it is the leg that proves the scalar fallback still compiles when the
  # byte-shuffle kernels are cfg'd away.
  no-std:
    name: no_std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, and leaving it in
          # .git/config is how it ends up inside an uploaded artifact.
          persist-credentials: false
      # The pin is read out of `rust-toolchain.toml` rather than asked for as `stable`,
      # because a job that installs *targets* is the one place the difference bites:
      # rustup honors the file over whatever the action made default, so `stable` here
      # would install `aarch64-unknown-none` for a toolchain nothing then runs, and the
      # 1.96.0 that actually compiles would have no `core` for it. Same derive-it-once
      # shape as the `msrv` job above, pointed at the other pin.
      - id: pin
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          targets: aarch64-unknown-none,x86_64-unknown-none
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: every feature combination
        run: |
          set -euo pipefail
          for features in "" "std" "regex-automata" "std,regex-automata"; do
            echo "::group::--no-default-features --features '$features'"
            cargo clippy --lib --locked --no-default-features --features "$features" -- -D warnings
            echo "::endgroup::"
          done
      - name: bare metal, where std does not exist to fall back on
        run: |
          set -euo pipefail
          for target in aarch64-unknown-none x86_64-unknown-none; do
            echo "::group::$target"
            cargo clippy --lib --locked --no-default-features --target "$target" -- -D warnings
            cargo clippy --lib --locked --no-default-features --features regex-automata \
              --target "$target" -- -D warnings
            echo "::endgroup::"
          done
      # Compiling is not running. `tests/dfa.rs` drives the entire pipeline —
      # projection, lattice harvest, selectivity, vector dispatch, pricing — off a
      # hand-written transition table, so it is the one suite that executes against the
      # library with its dependencies and its `std` removed rather than merely building
      # against it.
      - run: cargo test --locked --no-default-features --test dfa

  # The six native (OS, architecture) legs, on real silicon for each. Stated once in
  # `native.yml` and called from here and from `release.yml`, which is the arrangement
  # its own header has always described — it was only ever wired to the second, so the
  # cross-OS proof this repository advertises on every push happened on none of them.
  native:
    name: native
    uses: ./.github/workflows/native.yml
    with:
      cache: true

  # WebAssembly is the one target whose kernel is chosen at *compile* time, and it is
  # therefore the one no job above can reach. `arch::available` on `wasm32` reads
  # `target_feature = "simd128"` rather than a probe — a guest has no `CPUID` to ask and no
  # `XCR0` to read — so the SIMD leg and the scalar leg are two different builds rather
  # than two branches inside one, and a host job compiles neither.
  #
  # Both are built, and the SIMD one is *run*, under a real runtime. That distinction is
  # the whole value of this job: `u8x16_swizzle` had never executed anywhere until it
  # executed here, and a kernel that only ever compiled is exactly the state
  # `tests/kernels.rs` exists to refuse. Emulation is allowed to prove this kernel
  # correct and is never allowed to price it — see `.github/workflows/mint.yml`, where a
  # `wasm32` row has to name the runtime and the host underneath it.
  wasm:
    name: wasm32 (simd128)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, and leaving it in
          # .git/config is how it ends up inside an uploaded artifact.
          persist-credentials: false
      # Read out of `rust-toolchain.toml` for the reason the `no_std` leg spells out: the
      # file outranks the action's default, so targets asked for under `stable` would be
      # installed for a toolchain that never compiles anything here.
      - id: pin
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          targets: wasm32-wasip1,wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: wasmtime

      # The `no_std` leg first, and without `simd128`, because that combination is what a
      # default `wasm32-unknown-unknown` build actually gets: no runtime probe, no vector
      # module compiled, `Kernel::Scalar` reported honestly. If the `cfg` ladder in
      # `src/arch/mod.rs` ever stopped cfg-ing the SIMD module away, this is the build
      # that fails to compile rather than the one that silently ships it.
      - name: scalar, where the proposal is absent
        run: cargo clippy --lib --locked --no-default-features --target wasm32-unknown-unknown -- -D warnings

      # `u8x16_swizzle` executing, against the scalar reference it must agree with.
      #
      # Two seams make that possible on a target the mint has never reached. `kernels.rs`
      # drives `Skip` directly rather than through a lane the economics elected —
      # necessary here, because `wasm32` has no minted row, so its calibration is
      # `UNMEASURED`, no lane elects a skip, and without the direct seam the wide
      # classifier would be the one piece of `unsafe` on this target that nothing ever
      # ran. And the corpus is handed in through a WASI preopen, because a guest cannot
      # see the checkout: `$SHENG_CORPUS` is the same override a re-minter uses to aim at
      # their own tree, pointed at `/corpus` here so the real-source soundness pass reads
      # real source.
      #
      # `an_armed_sieve_retires_most_of_what_it_sees` is skipped by name, and only that
      # one. It audits the *gate's* promise — that a sieve which armed retires a majority
      # — and on an unpriced target nothing arms, so it has no population to measure and
      # fails on its own emptiness assertion. That emptiness is the policy working, and
      # the fact is asserted positively rather than dropped: `policy.rs`'s
      # `an_unmeasured_machine_declines_instead_of_guessing` runs in this same invocation
      # and requires the decline to name this arch and this kernel.
      - name: every kernel this runtime can run agrees with the reference
        env:
          RUSTFLAGS: -D warnings -C target-feature=+simd128
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir=.::/corpus --env SHENG_CORPUS=/corpus --
        run: |
          set -euo pipefail
          cargo test --release --all-features --locked --target wasm32-wasip1 \
            --test kernels --test soundness --test policy -- --nocapture \
            --skip an_armed_sieve_retires_most_of_what_it_sees

  # AVX-512, executed. This is the one rung in the ladder whose correctness no runner in
  # this repository can be relied on to prove: `native.yml`'s x86_64 legs sweep whatever
  # `arch::available` probed, and a fleet that hands out EPYC parts one morning and Xeon
  # parts the next turns "is the widest kernel differentiated" into a question about
  # scheduling. A kernel that has only ever compiled is the exact state
  # `tests/kernels.rs` exists to refuse, so it gets an emulator rather than an excuse.
  #
  # Correctness only, and the boundary is worth stating because it is the whole of this
  # crate's doctrine: emulation can say whether `vpshufb` on a `zmm` computes the scalar
  # answer, and it can say nothing whatever about what that costs. `price::MINTED` takes
  # rows from `mint.yml` on real silicon and from nowhere else, which is why AVX-512 stays
  # in `price::DORMANT` no matter how green this job is.
  #
  # `-skx` is Skylake-X: AVX512 F/CD/BW/DQ/VL, of which this crate's probe wants F and BW.
  # SDE is a whole emulated CPU rather than a `CPUID` patch, so `xgetbv` answers for the
  # emulated machine too — which matters here, because the probe reads `XCR0` for the
  # opmask and upper `zmm` state and a real host without AVX-512 has those bits clear.
  # If that ever stops being true the guard below fails the job, which is the right
  # outcome: the alternative is a leg that quietly re-tests SSSE3 under an emulator and
  # reports it as AVX-512 coverage.
  avx512:
    name: x86_64 AVX-512 (Intel SDE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, and leaving it in
          # .git/config is how it ends up inside an uploaded artifact.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `sdeVersion` is passed explicitly even though the action documents a default:
      # its `action.yml` declares the input required and spells the default with a
      # non-standard `defaultValue:` key that GitHub never injects, so an omitted input
      # surfaces as `Please, provide value for option "sdeVersion"`.
      - uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
        with:
          environmentVariableName: SDE_PATH
          sdeVersion: 10.8.0

      # Only `kernels`, and only its test binary. Two reasons, and they are the same
      # reason twice: an emulated CPU is orders of magnitude slower than the silicon
      # under it, so nothing that can run natively should run here.
      #
      # `tests/kernels.rs` is the suite that reaches AVX-512 at all. `soundness.rs`
      # differentiates *dispatch's* choice, and dispatch under SDE still elects `Ssse3` —
      # the ladder grows a rung that `price::MINTED` does not price, so the widest
      # **priced** kernel is unchanged. Which is the permission check working exactly as
      # written, and it means an emulated leg cannot smuggle an unpriced kernel into an
      # arming decision even here.
      #
      # `--target` names the host triple so the runner applies to the test binary and not
      # to build scripts, which are host artifacts and have no business inside Pin.
      - name: the widest x86_64 kernel, actually executed
        run: |
          set -euo pipefail
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="$SDE_PATH/sde64 -skx --"
          cargo test --release --all-features --locked \
            --target x86_64-unknown-linux-gnu --test kernels -- --nocapture \
            | tee sde.log
          # The guard. `-skx` asking for AVX-512 and this crate's own probe admitting it
          # are different claims, and only the second one is evidence: the probe is what
          # `force` validates against, so a ladder without `Avx512` means the sweep ran
          # the same narrow kernels the native legs already ran and this job proved
          # nothing it was added to prove.
          grep -q 'available kernels:.*Avx512' sde.log || {
            echo "::error::SDE ran but arch::available did not admit Avx512 — see the ladder above"
            exit 1
          }

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, and leaving it in
          # .git/config is how it ends up inside an uploaded artifact.
          persist-credentials: false
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-deny
      - run: cargo deny check

  # `cargo publish --dry-run` builds the package exactly as crates.io would receive
  # it and fails on anything the real publish would reject — the guarded release
  # workflow trusts this job rather than repeating the check under time pressure.
  package:
    name: package
    needs: [fmt, clippy, test, doc, msrv, no-std, native, wasm, avx512, deny]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with the checkout credential, and leaving it in
          # .git/config is how it ends up inside an uploaded artifact.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo package --locked
      - run: cargo publish --dry-run --locked

  # Fragment names/types/bodies parse, and towncrier's own draft render is
  # non-vacuous — proven on every PR rather than discovered at tag time, when
  # a malformed `changelog.d/` entry is far more expensive to fix.
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: The-Billy-Company/.github/actions/package-release@deb135f046122a10cabc861e96eb9941c2d09ddc # main
        with:
          command: changelog
          args: --root .

  # The one check `release.yml`'s preflight polls for on the exact tagged
  # commit (`release.toml`'s `[ci].required_check`). Everything above feeds
  # into it, so a red job blocks the tag rather than the publish workflow
  # discovering it minutes into a wheel build. `if: always()` is required —
  # the default `if` on a job would skip this one the moment anything
  # upstream failed, which is exactly the case it has to report on.
  release-ready:
    if: always()
    needs: [fmt, clippy, test, doc, msrv, no-std, native, wasm, avx512, deny, package, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: every required job is green
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 -c "
          import json, os
          needs = json.loads(os.environ['NEEDS'])
          failed = sorted(name for name, info in needs.items() if info['result'] != 'success')
          if failed:
              raise SystemExit(f'not release-ready: {failed} did not succeed')
          print(f'release-ready: {len(needs)} required jobs all succeeded')
          "
