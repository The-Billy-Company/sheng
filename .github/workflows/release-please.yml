# Open (and keep updating) a release PR from the conventional commits on main.
#
# The PR bumps `Cargo.toml` and every packaging manifest that mirrors it — the
# list lives in release-please-config.json, and each target line carries an
# `x-release-please-version` marker. Merging it tags `vX.Y.Z` and cuts a
# GitHub Release. Nothing here publishes: `release.yml` does that, triggered
# by the tag.
#
# ── Two things worth knowing before the first release
#
# 1. towncrier, not release-please, owns CHANGELOG.md — the curated fragments
#    under changelog.d/ are the notes people actually read, so the config sets
#    `skip-changelog`. The `fold changelog` job below folds them into
#    CHANGELOG.md at the exact version this PR bumps to and pushes that onto
#    the PR branch; it re-runs on every push to main while the PR stays open and
#    recomputes the whole fold from main each time, so the fold never falls behind
#    whatever fragments main is carrying when someone finally merges.
#    `release.yml`'s preflight re-checks the fold
#    landed before it will publish anything. That job also re-locks `Cargo.lock`,
#    which mirrors this crate's version but cannot carry a marker for the generic
#    updater to find — a lock left a version behind fails every `--locked` job on
#    the PR before it compiles anything.
#
# 2. This runs as a GitHub App, not as Actions, and it has to. Two independent
#    walls make the default GITHUB_TOKEN useless here: the enterprise forbids the
#    Actions identity from creating pull requests at all, and a tag GITHUB_TOKEN
#    pushes does not start another workflow (GitHub's recursive-CI guard), so
#    `release.yml` would never fire and the crate would need publishing by hand.
#    An installation token is a different actor and clears both. The App is
#    `billy-company-release`; its identifier is the org variable
#    RELEASE_APP_CLIENT_ID and its signing key the org secret
#    RELEASE_APP_PRIVATE_KEY, shared by every repo in the ecosystem so there is
#    one thing to rotate. The installation is scoped to this ecosystem's repos,
#    so a token minted here cannot reach the private monorepo.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: a half-applied release PR is worse than a slow one.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Deliberately no write here. Every write below is made with the App's
      # installation token, which carries its own contents/pull-requests/issues
      # grants; leaving GITHUB_TOKEN read-only keeps the Actions identity out of
      # the release path entirely rather than granting it rights it cannot use.
      contents: read
    outputs:
      # The JSON object of the currently open release PR — set only while one
      # is unmerged. The fold-changelog job below is what actually reads it.
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # Exchange the App's signing key for an installation token scoped to this
      # repo, valid one hour. Fails loudly if the App is not installed here.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id, not app-id: the action deprecated the numeric id.
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrow the token to the three grants release-please actually uses. A
          # minted token otherwise inherits everything the installation holds, so
          # without this a permission added to the App later would silently widen
          # every release run.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # release-please reads the commit history through the GitHub API, so there
      # is nothing to check out and nothing to build.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          token: ${{ steps.app-token.outputs.token }}

  # Folds changelog.d/ into CHANGELOG.md on the release PR's own branch, at the
  # exact version release-please just bumped `Cargo.toml` to on that branch —
  # read back through the shared `version` command rather than re-parsed here,
  # so this job agrees with the preflight by construction instead of by two
  # authors keeping two regexes in sync.
  fold-changelog:
    name: fold changelog
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          # Read-only, and only so the step below can find the open release PR when
          # release-please did not report one.
          permission-pull-requests: read

      # Which branch to fold onto. release-please reports `pr` only from the run that
      # creates or updates it, so a later push carrying nothing release-please acts on
      # leaves that output empty while the PR is open and still unfolded — which is how
      # a PR came to sit red on a lock this job exists to move. Fall back to asking for
      # the open PR release-please labels `autorelease: pending`.
      - id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          REPORTED: ${{ needs.release-please.outputs.pr }}
        run: |
          set -euo pipefail
          if [ -n "$REPORTED" ]; then
            branch=$(python3 -c 'import json,os; print(json.loads(os.environ["REPORTED"])["headBranchName"])')
          else
            branch=$(gh pr list --state open --base main --label 'autorelease: pending' \
              --json headRefName --jq '.[0].headRefName // ""')
          fi
          printf 'branch=%s\n' "$branch" >>"$GITHUB_OUTPUT"
          [ -n "$branch" ] || echo 'no open release PR: nothing to fold onto'

      - if: steps.pr.outputs.branch != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The App token is used only by the explicit git push below, which carries it
          # in a one-off remote URL. Do not leave it behind in `.git/config` for a later
          # step to upload in an artifact — which is also why no `token:` is passed here:
          # with credentials unpersisted the input authenticates nothing, and reading it
          # as if it did is what left this job committing a fold it could not push.
          persist-credentials: false
          ref: ${{ steps.pr.outputs.branch }}

      - if: steps.pr.outputs.branch != ''
        id: version
        uses: The-Billy-Company/.github/actions/package-release@deb135f046122a10cabc861e96eb9941c2d09ddc # main
        with:
          command: version
          args: --root .

      - if: steps.pr.outputs.branch != ''
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Fold changelog.d fragments into CHANGELOG.md at this PR's version
        if: steps.pr.outputs.branch != ''
        env:
          # Read through the environment rather than interpolated into the script: the
          # token so it is never a substring of a command line, the branch because it is
          # PR-supplied text and this is a shell.
          RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' \
            <<<'${{ steps.version.outputs.result }}')
          # Recompute the fold from main rather than appending to whatever this branch
          # already carries. towncrier refuses outright to write a second section for a
          # version it has already written, so an incremental fold is not merely wasteful
          # — a second run over an already-folded branch is a hard error, and fragments
          # that reached main after the first fold could never be folded at all. Taking
          # both paths from main makes the fold a function of main at this version:
          # idempotent when nothing moved, and complete when something did. release-please
          # sets `skip-changelog`, so nothing of its own is discarded here.
          git fetch --depth=1 \
            "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          git checkout FETCH_HEAD -- CHANGELOG.md changelog.d
          uv run --no-project --python 3.12 --with towncrier==25.8.0 \
            towncrier build --yes --version "$version"
          # `Cargo.lock` carries this crate's own version too, and release-please's
          # generic updater only rewrites the marked line in `Cargo.toml`. Until the
          # lock agrees, every `--locked` job on this PR fails before it compiles a
          # line — which is every Cargo job in ci.yml, so the release PR would sit
          # permanently red on a bump that broke nothing. `--workspace` moves the
          # members' own entries and nothing else, so no dependency can ride in on a
          # release commit. rustup resolves 1.96.0 from `rust-toolchain.toml` here the
          # same way every other job gets it.
          cargo update --workspace
          # Against HEAD, not the index: restoring the two paths from main above stages
          # them, and a bare `git diff` would compare the tree to that staging and call a
          # real change quiet.
          if git diff --quiet HEAD -- CHANGELOG.md changelog.d Cargo.lock; then
            echo "nothing new to fold at $version"
            exit 0
          fi
          git config user.name 'billy-company-release[bot]'
          git config user.email 'billy-company-release[bot]@users.noreply.github.com'
          git add CHANGELOG.md changelog.d Cargo.lock
          git commit -m "chore(changelog): fold fragments and lock v$version"
          git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${HEAD_BRANCH}"
