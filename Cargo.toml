# Its own workspace root, deliberately. An empty `[workspace]` table means a
# Cargo.toml appearing above this directory later cannot silently absorb the
# crate and take over its lockfile and lint configuration. `resolver = "3"` is
# declared rather than left to the edition-2024 default, for the same reason
# `autoexamples` is declared below: this crate's build shape is a fact stated
# once, not inferred from whichever Cargo happens to run it. `fuzz/` is excluded
# rather than made a member: cargo-fuzz's nightly-only sanitizer build must never
# share a lockfile with the stable library it targets.
[workspace]
resolver = "3"
exclude = [ "fuzz" ]

[package]
name = "sheng"
version = "0.2.0"                                                                 # x-release-please-version
edition = "2024"
license = "Apache-2.0"
# 1.95 is the floor the sources actually need; `rust-toolchain.toml` pins 1.96.0
# for development so everyone formats and lints identically.
rust-version = "1.95"
# Declared, not discovered, so `examples/common.rs` can be a shared module instead of a
# third example with no `main` — and so the examples directory stays flat.
autoexamples = false
description = "Register-resident refutation sieves for regex. Builds Hartmanis-Stearns SP-quotients of a pattern's automaton small enough to live in a SIMD register, and uses them to prove a document match-free before a real engine ever walks it. Sound by construction: a sieve may pass a non-matching document, never reject a matching one."
readme = "README.md"
homepage = "https://github.com/The-Billy-Company/sheng"
repository = "https://github.com/The-Billy-Company/sheng"
documentation = "https://docs.rs/sheng"
authors = [ "The Billy Company" ]
# crates.io allows five, so each has to earn its slot. `prefilter` is the term
# somebody types when they already know they want this shape of thing;
# `refutation` is the one nothing else on the index claims.
keywords = [ "regex", "prefilter", "simd", "automata", "refutation" ]
# `no-std` is not aspirational here: `--no-default-features` is the build the feature
# table below was designed around, so the audience browsing that category is the one
# this crate was shaped for.
categories = [ "text-processing", "algorithms", "no-std" ]
# A whitelist rather than a blacklist, for the same reason `resolver` and
# `autoexamples` are declared above: what a consumer receives is stated once, not
# inherited from whatever the repository accumulates, so the next workflow or release
# tool cannot quietly add itself to the tarball. What ships is what someone holding
# only the `.crate` can use — the sources, the tests and examples that argue they are
# right (`mint` is how a machine gets its own calibration row), the license trail, and
# the three configs that make a rebuild's own `clippy` and `deny` runs agree with this
# repository's. What does not: `.github/`, the hooks, and the release-please and
# towncrier machinery, which operate the repository rather than the crate — and
# `rust-toolchain.toml`, which would drag a downstream rebuild onto 1.96 when the
# sources only ever asked for `rust-version`. Every source directory is named by
# extension rather than wholesale, because `include` is the point at which Cargo stops
# consulting `.gitignore`: a bare `/src` would ship whatever the working tree is
# carrying that day, `.DS_Store` included.
include = [
  "/src/**/*.rs",
  "/src/**/README.md",
  "/tests/*.rs",
  "/tests/README.md",
  "/examples/*.rs",
  "/examples/README.md",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/SECURITY.md",
  "/clippy.toml",
  "/rustfmt.toml",
  "/deny.toml",
]

# docs.rs builds with the defaults otherwise, which would document the crate as if
# `regex-automata` were the only shape it has. `--cfg docsrs` turns on the `doc_cfg`
# leg in `src/lib.rs`, so the pattern constructors are *labeled* with the feature
# that carries them instead of silently appearing. Both targets are built because the
# crate's risk surface is two hand-written kernels, and NEON is half of it.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs" ]
targets = [ "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu" ]

# The scan path is arithmetic and sixteen bytes of table, so the default build is a
# convenience rather than a requirement. Turning the defaults off leaves a `no_std`
# crate whose only dependency is on the skip path.
[features]
default = [ "std", "regex-automata" ]

# Runtime facilities, none of which the sieve's arithmetic needs: `memchr`'s AVX2
# dispatch (which is worth real throughput on x86_64 — without `std` it is limited to
# SSE2, because runtime feature detection is what `std` is for) and `regex-automata`'s
# own std leg. Note what is NOT here: the feature probes for this crate's own kernels are
# hand-rolled off `CPUID` and `XCR0` in `src/arch/mod.rs`, and `core::error::Error` covers the
# error traits, so `no_std` costs no capability of sheng's own.
std = [ "memchr/std", "regex-automata?/std" ]

# The parser, and the `Dfa` impl for the engine that will run the confirming search.
# Default because reading the real engine's automaton is the soundness argument, not a
# convenience — but optional because nothing in it is on the scan path, so a caller
# who builds sieves elsewhere and only runs them here pays for none of it.
#
# `regex-syntax` rides along rather than earning a feature of its own: it is what
# `src/relax.rs` rewrites a repetition bound in, so it is meaningful only where there
# is a pattern string to parse — the exact condition this feature already names. It
# adds nothing to the graph either, being the crate `regex-automata`'s own `syntax`
# leg already resolves.
regex-automata = [ "dep:regex-automata", "dep:regex-syntax" ]

[dependencies]
# Not a dependency of the sieve, of the arithmetic, or of the kernel — only of
# `skip::Escape::Few`, the 1-to-3-byte searcher. Already in the graph under
# regex-automata, `no_std`-capable, and nothing hand-rolled here would match its
# tuning at that width — so the sieve borrows it rather than writing a fourth-best
# memchr. `default-features = false` because the `std` leg is elected above.
memchr = { version = "2.8.3", default-features = false }

# Where a pattern is *parsed*, which is the one thing this crate refuses to do
# itself: sheng reads its automaton from regex-automata's PUBLIC `dfa::Automaton`
# surface rather than reimplementing a parser, so a pattern means here exactly what it
# means to the engine that runs the confirming search. Optional, because that argument
# is about the automaton rather than about whose crate built it — see `src/dfa.rs`.
regex-automata = { version = "0.4.16", optional = true, default-features = false, features = [
  "alloc",
  "syntax",
  "nfa-thompson",
  "dfa-build",
] }

# The HIR a repetition bound lives in, and the only reason this is a direct dependency:
# `src/relax.rs` rebuilds a pattern's tree with every bound dropped, which is a sound
# over-approximation and the difference between pricing a `{16}`-shaped pattern and
# refusing it unpriced. Not a widening of the dependency graph — `regex-automata`'s
# `syntax` feature above already resolves exactly this crate, so the version is stated
# to keep the two on one copy of `Hir` rather than to pull anything new in. Kept out of
# the public API on purpose: nothing in `sheng`'s surface names an `Hir`, so this stays
# a private dependency and its next major version is not a breaking change here.
regex-syntax = { version = "0.8.11", optional = true, default-features = false }

# Every example is an instrument pointed at a *pattern*, so each needs the leg that
# can turn one into an automaton. Declared rather than inherited so
# `--no-default-features` builds the library instead of failing on the examples.
[[example]]
name = "bench"
path = "examples/bench.rs"
required-features = [ "regex-automata" ]

[[example]]
name = "census"
path = "examples/census.rs"
required-features = [ "regex-automata" ]

[[example]]
name = "skip"
path = "examples/skip.rs"
required-features = [ "regex-automata" ]

[[example]]
name = "mint"
path = "examples/mint.rs"
required-features = [ "regex-automata" ]

[[example]]
name = "survey"
path = "examples/survey.rs"
required-features = [ "regex-automata" ]

[dev-dependencies]
# The soundness harness needs a full engine to disagree with — and `dfa-search`, so it
# can run the automaton the sieve only ever refuted.
regex-automata = { version = "0.4.16", features = [
  "std",
  "syntax",
  "nfa-thompson",
  "dfa-build",
  "dfa-search",
] }

[lints.rust]
# Every `unsafe` operation states its own invariant; an `unsafe fn` body is not
# a blanket permission slip for the operations inside it.
unsafe_op_in_unsafe_fn = "deny"
# The stage modules stay `pub` for `Policy`'s measured types and the calibration
# examples, not as an invitation to read them undocumented — every item reachable
# from outside the crate earns an explanation of what it is.
missing_docs = "deny"

[lints.clippy]
# Library-light posture: pedantic is advisory here, not a gate.
pedantic = { level = "allow", priority = -1 }
# The rule that every `unsafe` block carries a `// SAFETY:` comment, enforced by
# the compiler instead of by review. This crate's entire risk surface is the
# hand-written intrinsics under `src/arch/` that `shuffle.rs` and `skip.rs` dispatch
# into, so it is the one lint worth denying.
undocumented_unsafe_blocks = "deny"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16

[profile.dev]
debug = "line-tables-only"

# Measurement builds keep symbols so a profiler can attribute the shuffle kernel.
[profile.profiling]
inherits = "release"
debug = true
strip = false
