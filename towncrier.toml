# Towncrier configuration for sheng.
#
#   towncrier create '+<slug>.<type>.md'   write one fragment per change
#   towncrier build --version x.y.z        fold them into CHANGELOG.md
#
# News fragments live in changelog.d/<issue>.<type>.md and are assembled into
# CHANGELOG.md at the `<!-- towncrier release notes start -->` marker on build.

[tool.towncrier]
name = "sheng"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
wrap = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
