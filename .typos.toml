# typos checks authored names and prose; lockfiles are machine output and carry
# hashes and package spellings nobody here controls. Gitignored sibling caches
# and build trees are already outside the walk through ignore-vcs.

[files]
extend-exclude = [
  "*.lock",
  "go.sum",
  "mise.lock",
]

[default]
# Public documentation uses US English.
locale = "en-us"
extend-ignore-identifiers-re = [
  # Content hashes and release identifiers are opaque, not words.
  "^[A-Za-z0-9_-]{20,}$",
]
